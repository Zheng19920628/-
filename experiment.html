<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>小学科学 - 点亮小灯泡(曲线软导线)</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
}
body {
    background: #f4f6f9;
    padding: 20px;
    font-family: "Microsoft Yahei", sans-serif;
}
h2 {
    text-align: center;
    margin-bottom: 10px;
    color: #222;
}
.tip {
    text-align: center;
    color: #555;
    margin-bottom: 15px;
    line-height: 1.6;
}
/* 实验面板 */
#panel {
    width: 850px;
    height: 520px;
    border: 2px solid #888;
    background: #fff;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
}

/* 灯泡容器 */
.bulb {
    position: absolute;
    left: 520px;
    top: 150px;
    width: 90px;
    height: 130px;
}
.bulb-off { display: block; }
.bulb-on  { display: none; }

/* 小型红色接线点 */
.point-side {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #e53935;
    position: absolute;
    left: 30px;
    top: 108px;
}
.point-bottom {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #e53935;
    position: absolute;
    left: 41px;
    bottom: -1px;
}

/* 曲线导线绘制层 */
#wireSvg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}
.curve-wire {
    stroke: #6d4c41;
    stroke-width: 7;
    stroke-linecap: round;
    fill: none;
}

/* 导线整体拖拽容器 */
.wire-wrap {
    position: absolute;
    cursor: grab;
    z-index: 5;
}
.wire-wrap:active {
    cursor: grabbing;
}

/* 导线两个端点 */
.wire-end {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #8d6e63;
    border: 2px solid #333;
    position: absolute;
    z-index: 10;
    cursor: grab;
}
.wire-end:active {
    cursor: grabbing;
}
</style>
</head>
<body>
<h2>点亮小灯泡 虚拟实验</h2>
<div class="tip">
操作说明：① 拖动导线空白处可整体移动电线；② 拖动两端圆点可让导线自由弯曲变形；<br>将两个端点分别接灯泡侧面、底部红色小点，灯泡即可点亮
</div>

<div id="panel">
    <!-- 小灯泡 + 红色接线点 -->
    <div class="bulb" id="bulbBox">
        <div class="point-side" id="pSide"></div>
        <div class="point-bottom" id="pBottom"></div>
        <svg class="bulb-off" width="90" height="130" viewBox="0 0 90 130">
            <path fill="#aaaaaa" d="M45,12 C66,12 78,35 78,62 C78,88 60,104 45,110 C30,104 12,88 12,62 C12,35 24,12 45,12Z"/>
            <rect x="36" y="110" width="18" height="16" fill="#777"/>
        </svg>
        <svg class="bulb-on" width="90" height="130" viewBox="0 0 90 130">
            <path fill="#ffd600" d="M45,12 C66,12 78,35 78,62 C78,88 60,104 45,110 C30,104 12,88 12,62 C12,35 24,12 45,12Z"/>
            <rect x="36" y="110" width="18" height="16" fill="#777"/>
        </svg>
    </div>

    <!-- 曲线导线 -->
    <svg id="wireSvg">
        <path class="curve-wire" id="wirePath"></path>
    </svg>

    <!-- 导线整体容器 + 两个端点 -->
    <div class="wire-wrap" id="wireWrap">
        <div class="wire-end" id="endTop"></div>
        <div class="wire-end" id="endBot"></div>
    </div>
</div>

<script>
const panel = document.getElementById('panel');
const wireWrap = document.getElementById('wireWrap');
const endTop = document.getElementById('endTop');
const endBot = document.getElementById('endBot');
const wirePath = document.getElementById('wirePath');
const pSide = document.getElementById('pSide');
const pBottom = document.getElementById('pBottom');
const bulbOff = document.querySelector('.bulb-off');
const bulbOn = document.querySelector('.bulb-on');

// 初始坐标
let wrapX = 160, wrapY = 100;
let topOffset = { x: 0, y: 0 };
let botOffset = { x: 0, y: 240 };

// 拖拽状态
let dragType = null; // wrap / top / bot
let dragOx = 0, dragOy = 0;

// 更新曲线导线 + 端点位置
function renderWire() {
    // 整体容器位置
    wireWrap.style.left = wrapX + 'px';
    wireWrap.style.top = wrapY + 'px';

    // 端点相对位置
    endTop.style.left = topOffset.x + 'px';
    endTop.style.top = topOffset.y + 'px';
    endBot.style.left = botOffset.x + 'px';
    endBot.style.top = botOffset.y + 'px';

    // 计算端点在面板中的绝对坐标
    const tX = wrapX + topOffset.x + 8;
    const tY = wrapY + topOffset.y + 8;
    const bX = wrapX + botOffset.x + 8;
    const bY = wrapY + botOffset.y + 8;

    // 二次贝塞尔曲线，实现平滑软导线效果
    const ctrlX = (tX + bX) / 2;
    const ctrlY = Math.min(tY, bY) - 90;
    wirePath.setAttribute('d', `M${tX},${tY} Q${ctrlX},${ctrlY} ${bX},${bY}`);

    checkLight();
}

// 碰撞检测
function isOverlap(elA, elB) {
    const r1 = elA.getBoundingClientRect();
    const r2 = elB.getBoundingClientRect();
    return !(r1.right < r2.left || r1.left > r2.right || r1.bottom < r2.top || r1.top > r2.bottom);
}

// 灯泡亮灭判断
function checkLight() {
    const tSide = isOverlap(endTop, pSide);
    const tBot = isOverlap(endTop, pBottom);
    const bSide = isOverlap(endBot, pSide);
    const bBot = isOverlap(endBot, pBottom);

    if ((tSide && bBot) || (tBot && bSide)) {
        bulbOff.style.display = 'none';
        bulbOn.style.display = 'block';
    } else {
        bulbOff.style.display = 'block';
        bulbOn.style.display = 'none';
    }
}

// 拖拽开始
function startDrag(e) {
    e.preventDefault();
    const rect = e.target.getBoundingClientRect();
    dragOx = e.clientX - rect.left;
    dragOy = e.clientY - rect.top;

    if (e.target === wireWrap) {
        dragType = 'wrap';
    } else if (e.target === endTop) {
        dragType = 'top';
    } else if (e.target === endBot) {
        dragType = 'bot';
    }
}

// 拖拽移动
function moveDrag(e) {
    if (!dragType) return;
    const pRect = panel.getBoundingClientRect();
    let mx = e.clientX - pRect.left - dragOx;
    let my = e.clientY - pRect.top - dragOy;

    // 边界限制
    mx = Math.max(0, Math.min(mx, pRect.width - 20));
    my = Math.max(0, Math.min(my, pRect.height - 20));

    if (dragType === 'wrap') {
        // 整体移动导线
        wrapX = mx;
        wrapY = my;
    } else if (dragType === 'top') {
        // 移动上端点，改变弯曲形状
        topOffset.x = mx - wrapX;
        topOffset.y = my - wrapY;
    } else if (dragType === 'bot') {
        // 移动下端点，改变弯曲形状
        botOffset.x = mx - wrapX;
        botOffset.y = my - wrapY;
    }
    renderWire();
}

// 拖拽结束
function endDrag() {
    dragType = null;
}

// 绑定事件
wireWrap.addEventListener('mousedown', startDrag);
endTop.addEventListener('mousedown', startDrag);
endBot.addEventListener('mousedown', startDrag);
document.addEventListener('mousemove', moveDrag);
document.addEventListener('mouseup', endDrag);

// 初始化渲染
renderWire();
</script>
</body>
</html>
